name: نشر «نون» على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تهيئة Pages
        uses: actions/configure-pages@v5

      - name: تجهيز ملفات التطبيق
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
