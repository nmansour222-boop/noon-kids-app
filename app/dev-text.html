<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:'AmiriFull';src:url('fonts/amiri-full.woff2') format('woff2');font-display:block}
@font-face{font-family:'AmiriSub';src:url('fonts/amiri-400.woff2') format('woff2');font-display:block}
body{background:#fff;padding:10px;font-family:sans-serif}
.row{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
.cell{background:#FFF8F0;border-radius:12px;padding:6px 10px;text-align:center}
.g{font-size:96px;line-height:1.9;color:#FF6B5A}
.lbl{font-size:11px;color:#888;font-family:sans-serif}
</style></head><body>
<div class="row" id="r1"></div><div class="row" id="r2"></div>
<script>
const words=['أ','بَ','بَّ','مِّ','نٌّ','تُ','سْ','قٍ','آ','ؤُ','ئِ','ة','ى','ك','ي','ع'];
[['AmiriFull','AmiriFull'],['AmiriSub','AmiriSub']].forEach(([n,f])=>{
  const c=document.createElement('div');c.className='cell';
  c.innerHTML='<div class="g" style="font-family:'+f+'">'+words.join(' ')+'</div><div class="lbl">'+n+'</div>';
  (n==='AmiriFull'?document.getElementById('r1'):document.getElementById('r2')).appendChild(c);
});
</script></body></html>
